quarkusPluginVersion=3.35.1
quarkusPlatformVersion=3.35.1

# Must match the Kotlin version the quarkus-bom enforces (Quarkus 3.35.1 -> Kotlin 2.3.21),
# otherwise incremental builds fail with NoSuchMethodError in the Kotlin compiler.
kotlinVersion=2.3.21

# The default daemon heap (~512m) is tight for Quarkus augmentation + Kotlin compilation.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
