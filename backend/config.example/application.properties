# Template for the production override. Copy to backend/config/application.properties (gitignored)
# or next to the runner JAR as config/application.properties and fill in the secrets.

mrright.data.dir=/opt/mr_right/data

smallrye.jwt.sign.key.location=file:/opt/mr_right/jwt-secret.jwk
smallrye.jwt.verify.key.location=file:/opt/mr_right/jwt-secret.jwk

mrright.auth.email-verification.link-base-url=https://mr-right.example.com/verify-email
mrright.auth.password-reset.link-base-url=https://mr-right.example.com/reset-password

quarkus.http.cors.enabled=false

quarkus.mailer.host=smtp.example.com
quarkus.mailer.port=587
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=
quarkus.mailer.password=
