# Distinct from the sibling projects (4711-4719), so several backends can run locally at once.
# The Vite dev server proxies /api here; in production Quarkus serves the built SPA on this port.
quarkus.http.port=4720
quarkus.http.enable-compression=true

mrright.info.version=0.0.1

# File-based storage: users/<userId>.json (games/ will follow). Relative to the working directory;
# gitignored. Production overrides it via backend/config/application.properties.
mrright.data.dir=data
%test.mrright.data.dir=build/test-data

# Unexpected (500) errors are logged with an error id; only dev also returns the stack trace.
mrright.errors.include-stack-trace=false
%dev.mrright.errors.include-stack-trace=true

# jackson-module-kotlin caches method handles of Kotlin value classes (UserId); making it reloadable
# avoids "loader constraint violation" errors after a dev hot reload.
quarkus.class-loading.reloadable-artifacts=com.fasterxml.jackson.module:jackson-module-kotlin

# CORS for local dev when the SPA is opened on the Vite dev server (it also proxies /api).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5174
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# --- Authentication ------------------------------------------------------------------------------
# HS256 JWT. The committed jwt-dev-secret.jwk is DEV-ONLY; production overrides both key locations.
mp.jwt.verify.issuer=mr-right
smallrye.jwt.sign.key.location=jwt-dev-secret.jwk
smallrye.jwt.verify.key.location=jwt-dev-secret.jwk
smallrye.jwt.verify.algorithm=HS256
# 30 days, so offline play and device switches don't keep forcing a new login.
mrright.auth.jwt.expiration-hours=720

# Dev/test skip email verification: registration auto-verifies and returns a token,
# the verify/resend/forgot/reset flows return 503.
mrright.auth.email-disabled=false
%dev.mrright.auth.email-disabled=true
%test.mrright.auth.email-disabled=true

mrright.auth.email-verification.token-ttl-minutes=1440
mrright.auth.email-verification.link-base-url=http://localhost:5174/verify-email
mrright.auth.password-reset.token-ttl-minutes=30
mrright.auth.password-reset.link-base-url=http://localhost:5174/reset-password

quarkus.mailer.from=Mr Right <noreply@mail.tobias-fassbender.com>
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true

# --- Games -----------------------------------------------------------------------------------------
# Regenerated puzzles; a 10,000-suitor puzzle takes a few MB on the heap.
quarkus.cache.caffeine."puzzles".maximum-size=30
quarkus.cache.caffeine."puzzles".expire-after-access=30M
